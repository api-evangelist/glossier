name: Glossier
description: >-
  Glossier is a direct-to-consumer beauty and personal-care brand (skincare, makeup,
  body, and fragrance) that sells through its own Shopify-powered storefront at
  glossier.com. It reached the API Evangelist network as a portfolio company of
  Forerunner Ventures, Index Ventures, IVP, and Thrive Capital. Glossier does not
  publish a traditional developer program, but its storefront is agent-native: it
  implements the Universal Commerce Protocol (UCP) with a live MCP endpoint for
  agent-driven catalog search, cart, and buyer-approved checkout, publishes /llms.txt
  and /agents.md agent instructions, and exposes Shopify Customer Account OAuth2/OIDC
  authentication with a discoverable authorization server.
